<!DOCTYPE html>
<html>
<head>
    <title>Resume Screening NLP</title>
</head>
<body>

<h2>📄 Resume Screening & Skill Gap Analyzer</h2>

<form method="POST" enctype="multipart/form-data">
    <input type="file" name="resume" required><br><br>
    <textarea name="jd" rows="6" placeholder="Paste job description here" required></textarea><br><br>
    <button type="submit">Analyze Resume</button>
</form>

{% if match_score is not none %}
<hr>
<h3>✅ Analysis Result</h3>

<p><b>Match Score:</b> {{ match_score }}%</p>

<p><b>Resume Skills:</b> {{ extracted_skills }}</p>
<p><b>JD Skills:</b> {{ jd_skills }}</p>
<p><b>Missing Skills:</b> {{ missing_skills }}</p>
{% endif %}

</body>
</html>
