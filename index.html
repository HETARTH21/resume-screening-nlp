<!DOCTYPE html>
<html>
<head>
    <title>Resume Screening NLP</title>
</head>
<body>
    <h2>Resume Screening & Skill Gap Analyzer</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="resume" required><br><br>
        <textarea name="jd" placeholder="Paste Job Description" rows="6" cols="60" required></textarea><br><br>
        <button type="submit">Analyze</button>
    </form>

    {% if score %}
        <h3>Match Score: {{ score }}%</h3>
<h3>Overall Text Match Score: {{ score }}%</h3>
<h3>Skill Match Score: {{ skill_score }}%</h3>

<h4>JD Required Skills:</h4>
<p>{{ jd_skills }}</p>

        <h4>Extracted Skills:</h4>
        <p>{{ skills }}</p>

        <h4>Missing Skills:</h4>
        <p>{{ missing }}</p>
    {% endif %}
</body>
</html>
